name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-save

      - name: Download KD-Tree binary
        run: bun run chromacore/bin/bootstrap.ts
        working-directory: ${{ github.workspace }}/chromacore

      - name: Verify KD-Tree binary
        run: ls -lh kdtree_cielab.bin
        working-directory: ${{ github.workspace }}/chromacore

      - name: Run ChromaCore tests
        run: bun test
        working-directory: ${{ github.workspace }}/chromacore
