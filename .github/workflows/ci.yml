name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-chromacore:
    name: ChromaCore Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ChromaCore dependencies
        run: bun install --no-save
        working-directory: ${{ github.workspace }}/chromacore

      - name: Download KD-Tree binary
        run: bun run bin/bootstrap.ts
        working-directory: ${{ github.workspace }}/chromacore

      - name: Verify KD-Tree binary
        run: ls -lh kdtree_cielab.bin
        working-directory: ${{ github.workspace }}/chromacore

      - name: Run ChromaCore tests
        run: bun test
        working-directory: ${{ github.workspace }}/chromacore

  test-mcp-tools:
    name: MCP Tools Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Mnemosyne dependencies
        run: bun install --no-save
        working-directory: ${{ github.workspace }}/mnemosyne

      - name: Run MCP tool smoke tests
        run: bun run mcp/test_tools.ts
        working-directory: ${{ github.workspace }}/mnemosyne
