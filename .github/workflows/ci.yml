name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-save

      - name: Show working directory and files
        run: |
          echo "CWD: $(pwd)"
          ls -la

      - name: Download KD-Tree binary
        run: bun run bin/bootstrap.ts

      - name: Verify KD-Tree binary exists
        run: ls -lh kdtree_cielab.bin

      - name: Run tests
        run: bun test
