name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Download KD-Tree binary
        run: bun run bin/bootstrap.ts

      - name: Verify KD-Tree binary exists
        run: |
          ls -lh kdtree_cielab.bin
          echo "CWD: $(pwd)"

      - name: Run tests
        run: bun test
